<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>提词录制器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--fs:30px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
html,body{height:100%;height:100dvh;width:100%;background:#000;color:#fff;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#vbox{position:relative;width:100%;height:100%;overflow:hidden;background:#111}
video{width:100%;height:100%;object-fit:cover;display:block}
video.mir{transform:scaleX(-1)}
#prompt{position:fixed;top:0;left:0;right:0;padding:calc(12px + var(--sat)) calc(16px + var(--sar)) 28px calc(16px + var(--sal));z-index:2;background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.4) 75%,transparent);text-align:center}
#pin{max-width:900px;margin:0 auto}
.side{font-size:calc(var(--fs)*.5);opacity:.45;line-height:1.4;min-height:1.4em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#cur{font-size:var(--fs);font-weight:600;line-height:1.45;margin:8px 0;text-shadow:0 2px 6px #000;overflow-wrap:anywhere}
#cur b{color:#ffd23f}#cur .p{color:#6cf;margin:0 4px}
#hint{font-size:15px;color:#9fe;margin-bottom:4px}#idx{font-size:13px;opacity:.6}
#bar{position:fixed;bottom:0;left:0;right:0;z-index:3;padding:8px calc(10px + var(--sar)) calc(8px + var(--sab)) calc(10px + var(--sal));background:rgba(0,0,0,.55)}
#barin{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button,select{font-size:19px;padding:16px 4px;border:0;border-radius:14px;background:rgba(255,255,255,.2);color:#fff;font-weight:600;cursor:pointer;min-width:0}
select{font-size:14px;padding:8px;border-radius:8px;background:#333;max-width:100%}
#rec{grid-column:1/-1;background:#e33}#rec.on{background:#555}
#next{background:#2a7}#redo{background:#d80}
#tools{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;justify-content:center}
#tools button{font-size:14px;padding:8px 12px;border-radius:8px}
#tools label{white-space:nowrap}
#keys{display:none;opacity:.6;font-size:13px}
#timer{color:#f66;font-variant-numeric:tabular-nums;font-size:16px}
#dl{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,420px);z-index:5;background:#222;padding:20px;border-radius:16px;display:none;text-align:center}
#dl a{display:block;margin:12px 0;padding:16px;background:#2a7;color:#fff;border-radius:12px;text-decoration:none;font-size:18px}
#msg{position:fixed;top:50%;width:100%;text-align:center;z-index:4;font-size:20px;pointer-events:none;padding:0 20px}
.desk-only{display:none}
/* 桌面：宽屏 + 鼠标 */
#introB{display:none}@media (max-height:500px){#introB{display:inline-block}}
@media (min-width:900px) and (hover:hover) and (pointer:fine){
 .desk-only{display:inline-flex}#keys{display:block;width:100%;text-align:center}
 #stage{bottom:var(--barh,170px)}
 #vbox{height:100%;width:auto;max-width:100%;aspect-ratio:16/9}
 body.crop #vbox{aspect-ratio:9/16}
 body:not(.crop) video{object-fit:contain}
 #barin{grid-template-columns:2fr 1fr 1fr 1fr}
 #rec{grid-column:auto}
}
/* 手机横屏 */
@media (orientation:landscape) and (max-height:500px){
 :root{--fs:22px}
 #prompt{padding-bottom:10px}#hint{font-size:12px}
 #barin{grid-template-columns:2fr 1fr 1fr 1fr}#rec{grid-column:auto}
 button{padding:10px 4px;font-size:16px}#tools{font-size:12px}
}
#upbox{grid-column:1/-1;text-align:center}#upbox label.big{display:inline-block;font-size:15px;padding:8px 14px;background:#357;border-radius:8px;cursor:pointer}
.prog{height:10px;background:#444;border-radius:5px;overflow:hidden;margin:8px 0;display:none}.prog i{display:block;height:100%;width:0;background:#4c8}
.upmsg{font-size:14px;word-break:break-all;margin-top:4px}#upg{background:#36c!important}
#sbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:6px}
#sbar .tab{font-size:14px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.18)}
#sbar .tab.on{background:#ffd23f;color:#000}
#intro{font-size:14px;line-height:1.5;background:rgba(30,60,90,.85);border-radius:10px;padding:8px 10px;margin-bottom:6px}
#intro b{color:#ffd23f}#intro button{font-size:12px;padding:4px 8px;border-radius:6px;margin-left:6px}
body.recing #intro,body.recing #sbar{display:none}
button,select,input{font-family:inherit}
#prompt{bottom:var(--barh,170px);display:flex;flex-direction:column;overflow:hidden}
#pin{width:100%;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#sbar,#intro,#hint,#idx,.side{flex:0 0 auto}
#intro{max-height:32vh;overflow-y:auto}
#cur{flex:0 1 auto;min-height:0;overflow:hidden;word-break:normal;line-break:strict}
#msg{position:static;grid-column:1/-1;font-size:15px;padding:0;width:auto}#msg:empty{display:none}
@media (max-height:500px){#intro.mini,#prev{display:none}#prompt{padding-top:calc(6px + var(--sat));padding-bottom:4px}#cur{margin:2px 0}#hint{margin-bottom:0}#bar{padding-top:4px}#barin{gap:5px}button{padding:9px 4px}.side{-webkit-line-clamp:1}#sbar .tab{font-size:12px;padding:4px 8px}#intro{font-size:12px;max-height:22vh}#tools{gap:4px 8px}#upbox label.big{font-size:12px;padding:4px 10px}#tools button{padding:5px 9px;font-size:12px}}
@media (max-width:480px){#tools{font-size:13px;gap:4px 8px}#tools button{padding:6px 9px;font-size:13px}button{padding:13px 4px}}
</style></head><body class="crop">
<div id="stage"><div id="vbox"><video id="v" class="mir" autoplay playsinline muted></video></div></div>
<div id="prompt"><div id="pin"><div id="sbar"></div><div id="intro"></div><div class="side" id="prev"></div><div id="hint"></div><div id="cur"></div><div class="side" id="nextS"></div><div id="idx"></div></div></div>
<div id="msg">点击「开始录制」或「开启摄像头」</div>
<div id="bar"><div id="barin">
<button id="rec">开始录制</button><button id="prevB">上一句</button><button id="redo">重读这句</button><button id="next">下一句</button>
<div id="tools">
<span id="timer">00:00</span><span id="meterW" style="display:inline-flex;align-items:center;gap:4px">🎙<span style="width:90px;height:10px;background:#333;border-radius:5px;overflow:hidden;display:inline-block"><i id="meter" style="display:block;height:100%;width:0;background:#4c8"></i></span><span id="meterDb" style="font-size:12px;width:56px;font-variant-numeric:tabular-nums">-∞</span></span><button id="micTest">🎤 测试 3s</button><span id="upst" style="font-size:12px;opacity:.8"></span>
<button id="fsm">A−</button><button id="fsp">A+</button>
<label><input type="checkbox" id="auto"> 自动翻页</label>
<label><input type="checkbox" id="mir" checked> 镜像预览</label>
<label><input type="checkbox" id="crop" checked> 输出 9:16</label>
<span class="desk-only" style="gap:6px;align-items:center">📷<select id="vsel"></select>🎤<select id="asel"></select></span>
<button id="listB">📁 已录制</button><button id="cam">开启摄像头</button>
<div id="upbox"><label class="big">📤 上传已下载的视频<input type="file" id="pick" accept="video/*,.json" multiple hidden></label><div class="prog" id="p2"><i></i></div><div class="upmsg" id="m2"></div></div>
<div id="keys">快捷键：空格 开始/停止 · →/Enter 下一句 · ← 上一句 · R 重读</div>
</div></div></div>
<div id="lst" style="position:fixed;inset:calc(10px + var(--sat)) 10px calc(10px + var(--sab));max-width:700px;margin:0 auto;z-index:6;background:#1b1b1b;border-radius:16px;padding:16px;overflow:auto;display:none">
<div style="display:flex;justify-content:space-between;align-items:center"><h3>已录制（云端）</h3><button onclick="lst.style.display='none'" style="padding:8px 14px;font-size:15px">关闭</button></div><div id="lstc" style="font-size:14px;margin-top:10px">加载中…</div></div>
<div id="dl"><h3>录制完成 · 自动上传中</h3><p id="ainfo" style="font-size:14px;margin:6px 0"></p><p id="dinfo" style="font-size:13px;opacity:.7"></p><a id="dv" download>下载视频</a><a id="dm" download="markers.json">下载 markers.json</a><a id="upg" href="#">📤 上传到云端</a><div class="prog" id="p1"><i></i></div><div class="upmsg" id="m1"></div><button onclick="dl.style.display='none'">关闭</button></div>

<script>
// 句子：文本中 / 表示停顿，**词** 表示重读
let S=[["加载中…","中",""]],SC={id:'',title:'',sentences:[]},SLIST=[];
const SKEY=()=>SC.id||'unknown';
const $=id=>document.getElementById(id);
const plain=t=>t.replace(/\*\*/g,'').replace(/\s*\/\s*/g,'');
const fmt=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\s*\/\s*/g,'\u0001').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\u0001/g,'<span class="p">/</span>');
let i=0,stream,rec,chunks=[],t0=0,markers=[],tick,autoT,wake,raf,outMode='';
const recording=()=>rec&&rec.state==='recording';
// 字号
let fs=+localStorage.getItem('tp_fs')||(innerWidth>=900?40:30);
function setFs(v){fs=Math.max(16,Math.min(72,v));document.documentElement.style.setProperty('--fs',fs+'px');localStorage.setItem('tp_fs',fs);if(window.fitCur)fitCur();}
setFs(fs);$('fsm').onclick=()=>setFs(fs-2);$('fsp').onclick=()=>setFs(fs+2);
// 开关持久化
for(const k of['mir','crop','auto']){const s=localStorage.getItem('tp_'+k);if(s!==null)$(k).checked=s==='1';$(k).addEventListener('change',()=>{localStorage.setItem('tp_'+k,$(k).checked?'1':'0');apply();});}
function apply(){$('v').classList.toggle('mir',$('mir').checked);document.body.classList.toggle('crop',$('crop').checked);schedAuto();fitBar();}
function fitBar(){document.documentElement.style.setProperty('--barh',$('bar').offsetHeight+'px');fitCur();}
function fitCur(){const c=$('cur'),p=$('prompt');if(!c)return;let f=fs;c.style.fontSize=f+'px';while(f>16&&(p.scrollHeight>p.clientHeight+1||c.scrollHeight>c.clientHeight+1)){f-=2;c.style.fontSize=f+'px';}}
new ResizeObserver(()=>fitBar()).observe(document.getElementById('bar'));
addEventListener('resize',fitBar);
function render(){$('prev').textContent=i>0?plain(S[i-1][0]):'';$('nextS').textContent=i<S.length-1?plain(S[i+1][0]):'（结束）';
$('cur').innerHTML=fmt(S[i][0]);$('hint').textContent='语速：'+S[i][1]+'　情绪：'+S[i][2];$('idx').textContent=(i+1)+' / '+S.length;fitCur();schedAuto();}
// ===== 脚本切换 =====
async function loadIndex(){try{const j=await (await fetch('/scripts/index.json',{cache:'no-store'})).json();SLIST=j.scripts;return j.default;}catch(e){return 'koubo';}}
function tabs(){$('sbar').innerHTML=SLIST.map(s=>`<button class="tab${s.id===SC.id?' on':''}" id="tab-${s.id}" data-id="${s.id}">${s.title}</button>`).join('')+'<button class="tab" id="introB">📖 说明</button>';
 $('introB').onclick=()=>intro($('intro').classList.contains('mini'));
 $('sbar').querySelectorAll('.tab[data-id]').forEach(b=>b.onclick=()=>{if(recording()){alert('录制中不能切换脚本，请先停止录制');return;}loadScript(b.dataset.id);});}
function intro(open){const el=$('intro');el.classList.toggle('mini',!open);if(!open){el.innerHTML=`<b>${SC.title}</b><button id="introT">看说明</button>`;}
 else el.innerHTML=`<b>📌 ${SC.title}</b>：${SC.purpose}<br>👉 ${SC.instructions}<br>开始：点下方红色「开始录制」，读完全部点「停止录制」，视频会自动上传。<button id="introT">收起</button>`;
 $('introT').onclick=()=>intro(!open);fitCur();}
async function loadScript(id){try{const r=await fetch('/scripts/'+encodeURIComponent(id)+'.json',{cache:'no-store'});if(!r.ok)throw r.status;SC=await r.json();}
 catch(e){if(id!=='koubo')return loadScript('koubo');return;}
 S=SC.sentences.map(s=>[s.text,s.speed,s.tone]);i=0;localStorage.setItem('tp_script',SC.id);
 const u=new URL(location.href);u.searchParams.set('script',SC.id);history.replaceState(null,'',u);
 document.body.dataset.script=SC.id;tabs();intro(innerHeight>=760);render();fitBar();}
const now=()=>recording()?+((performance.now()-t0)/1000).toFixed(2):null;
function mark(a){markers.push({t:now(),sentence:i+1,action:a,text:plain(S[i][0]),script:SKEY(),wall:new Date().toISOString()});}
function go(d,a){const n=i+d;if(n<0||n>=S.length)return;i=n;mark(a);render();}
function redo(){mark('redo');const c=$('cur');c.style.color='#ffd23f';setTimeout(()=>c.style.color='',300);schedAuto();}
$('next').onclick=()=>go(1,'next');$('prevB').onclick=()=>go(-1,'prev');$('redo').onclick=redo;
function schedAuto(){clearTimeout(autoT);if(!$('auto').checked||!recording())return;
const sp={'快':0.17,'中':0.22,'慢':0.3}[S[i][1]];autoT=setTimeout(()=>go(1,'auto-next'),plain(S[i][0]).length*sp*1000+1200);}
// 设备
async function listDev(){try{const ds=await navigator.mediaDevices.enumerateDevices();
for(const [sel,kind] of[[$('vsel'),'videoinput'],[$('asel'),'audioinput']]){const cur=sel.value;sel.innerHTML='';
ds.filter(d=>d.kind===kind).forEach((d,n)=>{const o=new Option(d.label||(kind==='videoinput'?'摄像头 ':'麦克风 ')+(n+1),d.deviceId);sel.add(o);});
const tr=stream&&stream.getTracks().find(t=>t.kind===kind.replace('input',''));const id=cur||(tr&&tr.getSettings().deviceId);if(id)sel.value=id;}}catch(e){}}
async function cam(force){if(stream&&!force)return true;
if(stream)stream.getTracks().forEach(t=>t.stop());
const desk=matchMedia('(min-width:900px) and (pointer:fine)').matches,vid=$('vsel').value,aid=$('asel').value;
const v=vid?{deviceId:{exact:vid}}:{facingMode:'user'};
Object.assign(v,desk?{width:{ideal:1920},height:{ideal:1080}}:{width:{ideal:1080},height:{ideal:1920},aspectRatio:{ideal:9/16}});
try{stream=await navigator.mediaDevices.getUserMedia({video:v,audio:Object.assign({echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1,sampleRate:48000},aid?{deviceId:{exact:aid}}:{})});
$('v').srcObject=stream;$('msg').textContent='';startMeter();$('cam').style.display='none';await listDev();return true;}
catch(e){$('msg').textContent='摄像头失败：'+e.message;return false;}}
$('cam').onclick=()=>cam();
$('vsel').onchange=$('asel').onchange=()=>{if(!recording())cam(true);else alert('录制中不能切换设备');};
navigator.mediaDevices&&navigator.mediaDevices.addEventListener&&navigator.mediaDevices.addEventListener('devicechange',listDev);
async function lock(){try{if('wakeLock'in navigator)wake=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')lock();});
function mime(){for(const m of['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'])if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;return '';}
// 9:16 居中裁剪：canvas 绘制 + captureStream
function cropStream(){const v=$('v'),vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;
let cw,ch;if(vw/vh>9/16){ch=vh;cw=Math.round(vh*9/16);}else{cw=vw;ch=Math.round(vw*16/9);}
cw-=cw%2;ch-=ch%2;const c=document.createElement('canvas');if(!c.captureStream)return null;
c.width=cw;c.height=ch;const g=c.getContext('2d'),sx=(vw-cw)/2,sy=(vh-ch)/2;
const draw=()=>{g.drawImage(v,sx,sy,cw,ch,0,0,cw,ch);raf=requestAnimationFrame(draw);};draw();
const s=c.captureStream(30);stream.getAudioTracks().forEach(t=>s.addTrack(t));s._res=cw+'x'+ch;return s;}
async function toggleRec(){
if(recording()){mark('stop');rec.stop();return;}
if(!await cam())return;lock();chunks=[];markers=[];const m=mime();
const v=$('v');if(!v.videoWidth)await new Promise(r=>v.onloadedmetadata=r);
let src=stream,info;const vs=stream.getVideoTracks()[0].getSettings();
const portrait=v.videoHeight>v.videoWidth&&Math.abs(v.videoWidth/v.videoHeight-9/16)<.02;
if($('crop').checked&&!portrait){const cs=cropStream();if(cs){src=cs;outMode='9:16 canvas 居中裁剪 '+cs._res;}else outMode='原生（浏览器不支持 canvas 录制）';}
else outMode='原生 '+v.videoWidth+'x'+v.videoHeight;
rec=new MediaRecorder(src,Object.assign({videoBitsPerSecond:8e6,audioBitsPerSecond:128000},m?{mimeType:m}:{}));
sess=new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14)+'-'+SKEY()+'-'+Math.random().toString(36).slice(2,6);document.body.classList.add('recing');fitCur();
recExt=(m||'').includes('mp4')?'mp4':'webm';seq=0;upQ=[];upBytes=0;totBytes=0;setUp('');
rec.ondataavailable=e=>{if(!e.data.size)return;chunks.push(e.data);upQ.push({seq:seq++,blob:e.data});totBytes+=e.data.size;pump();};
rec.onstop=()=>{document.body.classList.remove('recing');fitCur();cancelAnimationFrame(raf);clearInterval(tick);clearTimeout(autoT);$('rec').textContent='开始录制';$('rec').classList.remove('on');
const type=rec.mimeType||m||'video/webm',ext=type.includes('mp4')?'mp4':'webm',ts=new Date().toISOString().replace(/[:.]/g,'-');
const blob=new Blob(chunks,{type});$('dv').href=URL.createObjectURL(blob);$('dv').download='aroll-'+ts+'.'+ext;
$('dinfo').textContent=outMode+' · '+(blob.size/1048576).toFixed(1)+' MB · '+type;analyzeRec(blob);
$('dm').href=URL.createObjectURL(new Blob([JSON.stringify({session:sess,script:{id:SC.id,title:SC.title,sentences:S.length},mimeType:type,output:outMode,camera:vs.width+'x'+vs.height,markers},null,2)],{type:'application/json'}));
$('dm').download='markers-'+ts+'.json';finalize(JSON.stringify({session:sess,script:{id:SC.id,title:SC.title,sentences:S.length},mimeType:type,output:outMode,camera:vs.width+'x'+vs.height,markers},null,2));lastFiles=[{blob,name:$('dv').download},{blob:new Blob([JSON.stringify({session:sess,script:{id:SC.id,title:SC.title,sentences:S.length},mimeType:type,output:outMode,camera:vs.width+'x'+vs.height,markers},null,2)]),name:$('dm').download}];$('dl').style.display='block';};
rec.start(5000);t0=performance.now();mark('start');$('rec').textContent='停止录制';$('rec').classList.add('on');
tick=setInterval(()=>{const s=Math.floor(now()||0);$('timer').textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},500);schedAuto();}
$('rec').onclick=toggleRec;
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'&&e.target.type!=='checkbox')return;
const k=e.key;if(k===' '){e.preventDefault();toggleRec();}else if(k==='ArrowRight'||k==='Enter'){e.preventDefault();go(1,'next');}
else if(k==='ArrowLeft'){e.preventDefault();go(-1,'prev');}else if(k==='r'||k==='R'){redo();}});
// 按钮获得焦点后空格会触发 click，避免重复
document.querySelectorAll('button,input').forEach(b=>b.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')e.preventDefault();}));
// ===== 麦克风电平 / 测试 / 录后分析 =====
let actx,analyser,meterSrc,meterTrack,peakHold=-100,testPeak=null;
const dB=v=>v>0?20*Math.log10(v):-100;
function getCtx(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state!=='running')actx.resume();return actx;}
['click','touchend','keydown'].forEach(ev=>addEventListener(ev,()=>{if(actx&&actx.state!=='running')actx.resume();},{passive:true}));
function startMeter(){try{const t=stream&&stream.getAudioTracks()[0];if(!t)return;const c=getCtx();
 if(meterTrack===t)return;meterTrack=t;if(meterSrc)meterSrc.disconnect();
 // 只做分析：用克隆轨道，不接 destination，不影响录制用的原始轨道
 meterSrc=c.createMediaStreamSource(new MediaStream([t.clone()]));analyser=c.createAnalyser();analyser.fftSize=2048;meterSrc.connect(analyser);
 const buf=new Float32Array(analyser.fftSize);
 (function loop(){analyser.getFloatTimeDomainData(buf);let pk=0;for(const x of buf){const a=Math.abs(x);if(a>pk)pk=a;}
  const d=dB(pk);if(testPeak!==null&&d>testPeak)testPeak=d;peakHold=Math.max(d,peakHold-1.5);
  const pct=Math.max(0,Math.min(100,(peakHold+60)/60*100));$('meter').style.width=pct+'%';
  $('meter').style.background=peakHold>-3?'#e33':peakHold<-35?'#fa0':'#4c8';$('meterDb').textContent=(peakHold<=-99?'-∞':peakHold.toFixed(0))+' dB';
  requestAnimationFrame(loop);})();}catch(e){console.warn('meter',e);}}
async function micTest(){if(!await cam())return;getCtx();startMeter();testPeak=-100;const b=$('micTest');b.disabled=true;
 for(let i=3;i>0;i--){b.textContent='🎤 请说话… '+i;await sleep(1000);}
 const pk=testPeak;testPeak=null;b.disabled=false;b.textContent='🎤 测试 3s';
 const ok=pk>=-35;$('msg').textContent=ok?'':`⚠️ 麦克风太小声（峰值 ${pk.toFixed(0)} dBFS < -35）：请靠近麦克风、检查输入设备/系统音量`;
 if(ok){$('msg').textContent=`✅ 麦克风正常（峰值 ${pk.toFixed(0)} dBFS）`;setTimeout(()=>{if($('msg').textContent.startsWith('✅'))$('msg').textContent='';},2500);}return ok;}
$('micTest').onclick=micTest;
async function analyzeRec(blob){const el=$('ainfo');el.textContent='🔊 分析录音音量…';
 try{const ab=await blob.arrayBuffer();const c=getCtx();const buf=await new Promise((r,j)=>{const p=c.decodeAudioData(ab,r,j);if(p&&p.then)p.then(r,j);});
  let pk=0,ss=0,n=0;for(let ch=0;ch<buf.numberOfChannels;ch++){const d=buf.getChannelData(ch);for(let i=0;i<d.length;i++){const a=Math.abs(d[i]);if(a>pk)pk=a;ss+=d[i]*d[i];}n+=d.length;}
  const P=dB(pk),R=dB(Math.sqrt(ss/Math.max(1,n)));const quiet=P<-20||R<-45;
  el.innerHTML=(quiet?'⚠️ <b style="color:#fa0">录音音量过低</b>':'✅ 录音音量正常')+`：峰值 ${P.toFixed(1)} dBFS，RMS ${R.toFixed(1)} dBFS`+(quiet?'<br>建议检查麦克风后重录':'');
  window.lastAudioStats={peak:P,rms:R,quiet};
 }catch(e){el.textContent='（无法在浏览器内分析音频：'+(e.message||e)+'）';}}
// ===== 云端直传（Vercel Blob）=====
const KEY=(new URLSearchParams(location.search).get('k')||localStorage.getItem('tp_k')||'');if(KEY)localStorage.setItem('tp_k',KEY);
const HUP='/api/upload?k='+encodeURIComponent(KEY);
let sess,recExt,seq=0,upQ=[],pumping=false,upBytes=0,totBytes=0,finBody=null,finBusy=false,lastFiles=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(6,'0');
function setUp(t,pct){$('m1').innerHTML=t;if(pct!=null){$('p1').style.display='block';$('p1').firstChild.style.width=pct+'%';}$('upst').textContent=t.replace(/<[^>]+>/g,' ');}
async function put(path,blob,opt={}){return blobUpload(path,blob,Object.assign({access:'public',handleUploadUrl:HUP,contentType:blob.type||'application/octet-stream',multipart:blob.size>8*1048576},opt));}
async function retry(fn,label){for(let t=1;;t++){try{return await fn();}catch(e){const w=Math.min(30,2**t);setUp(`⚠️ ${label} 失败（${e.message||e}），${w}s 后重试（第${t}次）`);if(/bad key|401/.test(String(e.message||e))){setUp('❌ 访问密钥无效：请用带 ?k= 的链接打开');throw e;}await sleep(w*1000);}}}
// 录制中：每 5s 分片上传到 recordings/<会话>/chunks/
async function pump(){if(pumping||!KEY)return;pumping=true;
 while(upQ.length){const c=upQ[0];await retry(()=>put(`recordings/${sess}/chunks/${pad(c.seq)}.${recExt}`,c.blob),'分片 '+c.seq);
  upQ.shift();upBytes+=c.blob.size;if(!finBody)setUp(`☁️ 分片已同步 ${(upBytes/1048576).toFixed(1)} / ${(totBytes/1048576).toFixed(1)} MB`);}
 pumping=false;}
// 停止后：自动上传完整视频 + markers.json
function finalize(body){finBody=body;$('upg').textContent='🔁 重试上传';$('upg').style.display='none';setTimeout(doFinal,0);}
async function doFinal(){if(finBusy||!finBody)return;if(!KEY){setUp('❌ 缺少访问密钥 ?k=，未上传；请先下载备份');$('upg').style.display='block';return;}
 finBusy=true;const v=lastFiles[0];
 try{const vr=await retry(()=>put(`recordings/${sess}/video.${recExt}`,v.blob,{onUploadProgress:p=>setUp(`☁️ 上传视频 ${(p.loaded/1048576).toFixed(1)} / ${(p.total/1048576).toFixed(1)} MB`,p.percentage)}),'视频上传');
  const mr=await retry(()=>put(`recordings/${sess}/markers.json`,new Blob([finBody],{type:'application/json'})),'markers 上传');
  finBody=null;setUp(`✅ 已自动上传到云端：<br>${sess}/video.${recExt}<br>${sess}/markers.json<br>(${(v.blob.size/1048576).toFixed(1)} MB)`,100);
 }catch(e){setUp('❌ 上传失败：'+(e.message||e)+'。可点「重试上传」，或先下载备份。');$('upg').style.display='block';}
 finBusy=false;}
async function upAll(files,bar,msg){if(!files.length)return;if(!KEY){msg.textContent='❌ 缺少访问密钥 ?k=';return;}
 bar.style.display='block';const sid=new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14)+'-manual';const total=files.reduce((a,f)=>a+f.blob.size,0);let d=0,saved=[];
 try{for(const f of files){const name=f.name.replace(/[^\w.\-\u4e00-\u9fff]/g,'_');
   await retry(()=>put(`recordings/${sid}/${name}`,f.blob,{onUploadProgress:p=>{bar.firstChild.style.width=((d+p.loaded)/total*100).toFixed(1)+'%';msg.textContent=`上传中 ${name} ${((d+p.loaded)/1048576).toFixed(1)}/${(total/1048576).toFixed(1)} MB`;}}),name);
   saved.push(sid+'/'+name);d+=f.blob.size;}
  bar.firstChild.style.width='100%';msg.innerHTML='✅ 上传成功：<br>'+saved.join('<br>');}catch(e){msg.textContent='❌ 上传失败：'+(e.message||e)+'（已成功：'+saved.join(', ')+'）';}}
$('upg').onclick=e=>{e.preventDefault();if(finBody)doFinal();else upAll(lastFiles,$('p1'),$('m1'));};
$('pick').onchange=e=>{upAll([...e.target.files].map(f=>({blob:f,name:f.name})),$('p2'),$('m2'));e.target.value='';};
$('listB').onclick=async()=>{$('lst').style.display='block';$('lstc').textContent='加载中…';
try{const r=await fetch('/api/recordings?k='+encodeURIComponent(KEY),{cache:'no-store'});const j=await r.json();if(!r.ok)throw j.error||r.status;
$('lstc').innerHTML=j.recordings.length?j.recordings.map(r=>`<div style="border-top:1px solid #333;padding:10px 0"><b>${r.session}</b> <span style="color:${r.status=='complete'?'#4c8':'#fa0'}">${{complete:'✅ 完成',manual:'📤 手动上传','in-progress':'⏳ 仅分片（'+r.chunk_count+' 片）'}[r.status]}</span><br><span style="opacity:.6">${new Date(r.created).toLocaleString()}</span><br>`+
r.files.map(f=>`<a href="${f.downloadUrl}" style="color:#6cf">${f.name}</a> <span style="opacity:.6">${(f.bytes/1048576).toFixed(2)} MB</span>`).join('<br>')+'</div>').join(''):'暂无录制';}
catch(e){$('lstc').textContent='加载失败：'+e;}};
if(!KEY)$('msg').textContent='⚠️ 链接缺少 ?k= 访问密钥，录制后无法自动上传（仍可本地下载）';
$('barin').prepend($('msg'));apply();render();listDev();loadIndex().then(d=>loadScript(new URLSearchParams(location.search).get('script')||localStorage.getItem('tp_script')||d));
</script></body></html>
